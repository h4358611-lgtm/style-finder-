<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auriant – Luxury Style Explorer</title>

  <!-- React / ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- React Router (HashRouter) -->
  <script src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.development.js"></script>

  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion/dist/framer-motion.umd.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide-react/dist/lucide-react.umd.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Babel (needed for JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { @apply bg-gradient-to-br from-neutral-950 via-neutral-900 to-neutral-800 font-sans; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { HashRouter, Routes, Route, Link, useLocation } = ReactRouterDOM;
    const { motion } = window['framer-motion'];
    const { Home, User, Heart, ChevronLeft, ChevronRight, Search, UserCircle } = window['lucide-react'];

    function Navbar(){
      return (
        <div className="fixed top-0 left-0 right-0 p-4 bg-black/70 text-white text-xl font-bold">
          Auriant
        </div>
      );
    }

    function Sidebar(){
      const loc = useLocation();
      const nav = [
        { title:'Discover', path:'/', icon:Home },
        { title:'Prefs', path:'/preferences', icon:User },
        { title:'Faves', path:'/favorites', icon:Heart },
      ];
      return (
        <aside className="hidden md:block w-60 p-4 bg-black/30 text-white fixed top-16 left-0 bottom-0">
          {nav.map(i=>(
            <Link key={i.title} to={i.path} className={`block p-2 ${loc.pathname===i.path?'bg-white text-black':''}`}>
              <i.icon className="inline-block w-5 h-5 mr-2"/> {i.title}
            </Link>
          ))}
        </aside>
      );
    }

    function Discover(){
      return <div className="pt-24 text-white text-2xl font-semibold">Discover Page</div>;
    }
    function Preferences(){
      return <div className="pt-24 text-white text-2xl font-semibold">Preferences Page</div>;
    }
    function Favorites(){
      return <div className="pt-24 text-white text-2xl font-semibold">Favorites Page</div>;
    }

    function App(){
      return (
        <HashRouter>
          <Navbar/>
          <Sidebar/>
          <div className="ml-0 md:ml-64 p-4">
            <Routes>
              <Route path="/" element={<Discover/>}/>
              <Route path="/preferences" element={<Preferences/>}/>
              <Route path="/favorites" element={<Favorites/>}/>
            </Routes>
          </div>
        </HashRouter>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
