<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Auriant – Style Finder</title>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- Router -->
<script src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.development.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- stop favicon 404 -->
<link rel="icon" href="data:,">

<style>
body{font-family:system-ui,Arial}
</style>
</head>

<body class="bg-gradient-to-br from-neutral-900 to-neutral-800 text-white">
<div id="root"></div>

<script>
const { HashRouter, Routes, Route, Link, useLocation } = ReactRouterDOM;

/* simple icons (no CDN needed) */
const Home = () => React.createElement("span",null,"🏠");
const User = () => React.createElement("span",null,"👤");
const HeartIcon = ({active}) =>
  React.createElement("span",{className:active?"text-red-500":"text-white/40"},"❤️");


/* ---------- PRODUCTS ---------- */
const brands = ["Gucci","Nike","Adidas","Zara","H&M","Prada","Dior","Louis Vuitton","Puma","Reebok"];
const ITEMS_PER_BRAND = 40;

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}

let products=[];

brands.forEach(b=>{
  for(let i=0;i<ITEMS_PER_BRAND;i++){
    let price;
    if(["Gucci","Prada","Dior","Louis Vuitton"].includes(b)) price=rand(900,4000);
    else if(["Nike","Adidas","Puma","Reebok"].includes(b)) price=rand(80,220);
    else price=rand(40,180);

    products.push({
      id:b+i,
      brand:b,
      name:`${b} Item ${i+1}`,
      price,
      img:`https://picsum.photos/400/600?random=${i+b.length}`,
      url:`https://www.${b.replace(" ","").toLowerCase()}.com`
    });
  }
});


/* ---------- NAV ---------- */
function Navbar(){
  return React.createElement("div",
    {className:"fixed top-0 left-0 right-0 bg-black/70 backdrop-blur px-6 py-4 text-2xl font-semibold z-50"},
    "Auriant"
  );
}

function Sidebar(){
  const loc=useLocation();
  const nav=[
    {path:"/",title:"Discover",icon:Home},
    {path:"/favorites",title:"Favorites",icon:HeartIcon},
    {path:"/preferences",title:"Preferences",icon:User}
  ];

  return React.createElement("aside",
    {className:"hidden md:block fixed top-16 left-0 bottom-0 w-64 bg-black/30 p-4"},
    nav.map(n=>
      React.createElement(Link,{
        key:n.path,
        to:n.path,
        className:"flex gap-3 items-center px-4 py-3 rounded-xl mb-2 "+(loc.pathname===n.path?"bg-white text-black":"hover:bg-white/10")
      },
      React.createElement(n.icon,{active:true}),
      n.title
    ))
  );
}


/* ---------- DISCOVER ---------- */
function Discover(){
  const [brand,setBrand]=React.useState("All");
  const [fav,setFav]=React.useState(JSON.parse(localStorage.getItem("fav")||"[]"));

  function toggle(e,id){
    e.preventDefault();
    const f=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];
    setFav(f);
    localStorage.setItem("fav",JSON.stringify(f));
  }

  const filtered=products.filter(p=>brand==="All"||p.brand===brand);

  return React.createElement("div",{className:"pt-28"},

    React.createElement("select",{
      value:brand,
      onChange:e=>setBrand(e.target.value),
      className:"mb-6 px-3 py-2 rounded bg-black/40"
    },
      React.createElement("option",{value:"All"},"All Brands"),
      brands.map(b=>React.createElement("option",{key:b,value:b},b))
    ),

    React.createElement("div",{className:"grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"},
      filtered.map(item=>
        React.createElement("a",{
          key:item.id,
          href:item.url,
          target:"_blank",
          className:"bg-white/10 rounded-2xl overflow-hidden hover:-translate-y-1 transition block"
        },
          React.createElement("img",{src:item.img,className:"w-full h-72 object-cover"}),

          React.createElement("div",{className:"p-3 flex justify-between items-center"},
            React.createElement("div",null,
              React.createElement("div",{className:"text-sm text-white/60"},item.brand),
              React.createElement("div",{className:"font-medium"},item.name),
              React.createElement("div",{className:"text-white/80"},"€"+item.price)
            ),
            React.createElement("span",{onClick:e=>toggle(e,item.id)},
              React.createElement(HeartIcon,{active:fav.includes(item.id)})
            )
          )
        )
      )
    )
  );
}


/* ---------- FAVORITES ---------- */
function Favorites(){
  const fav=JSON.parse(localStorage.getItem("fav")||"[]");
  const list=products.filter(p=>fav.includes(p.id));

  return React.createElement("div",{className:"pt-28 grid grid-cols-2 md:grid-cols-3 gap-6"},
    list.length?list.map(i=>React.createElement("img",{key:i.id,src:i.img,className:"rounded-xl"})):"No favorites yet"
  );
}


/* ---------- APP ---------- */
function App(){
  return React.createElement(HashRouter,null,
    React.createElement(Navbar),
    React.createElement(Sidebar),
    React.createElement("main",{className:"md:ml-64 px-6 pb-20"},
      React.createElement(Routes,null,
        React.createElement(Route,{path:"/",element:React.createElement(Discover)}),
        React.createElement(Route,{path:"/favorites",element:React.createElement(Favorites)}),
        React.createElement(Route,{path:"/preferences",element:React.createElement("div",{className:"pt-28"},"Preferences soon")})
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
