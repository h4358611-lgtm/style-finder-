<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auriant – Luxury Style Explorer</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- React Router -->
  <script src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.development.js"></script>

  <!-- Framer Motion (UMD) -->
  <script src="https://unpkg.com/framer-motion/dist/framer-motion.umd.js"></script>

  <!-- Lucide Icons (UMD) -->
  <script src="https://unpkg.com/lucide-react/dist/lucide-react.umd.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Babel (required for JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gradient-to-br from-neutral-950 via-neutral-900 to-neutral-800 text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { HashRouter, Routes, Route, Link, useLocation } = ReactRouterDOM;
    const { motion, AnimatePresence } = window.framerMotion;
    const { Home, User, Heart } = window.lucideReact;

    function Navbar() {
      return (
        <div className="fixed top-0 left-0 right-0 z-50 backdrop-blur bg-black/60 px-6 py-4 text-2xl font-semibold">
          Auriant
        </div>
      );
    }

    function Sidebar() {
      const loc = useLocation();
      const nav = [
        { title: "Discover", path: "/", icon: Home },
        { title: "Preferences", path: "/preferences", icon: User },
        { title: "Favorites", path: "/favorites", icon: Heart },
      ];

      return (
        <aside className="hidden md:block fixed top-16 left-0 bottom-0 w-64 p-4 bg-black/30 backdrop-blur">
          {nav.map(i => (
            <Link
              key={i.title}
              to={i.path}
              className={`flex items-center gap-3 px-4 py-3 rounded-xl mb-2 transition
                ${loc.pathname === i.path
                  ? "bg-white text-black"
                  : "hover:bg-white/10"}`}
            >
              <i.icon className="w-5 h-5" />
              {i.title}
            </Link>
          ))}
        </aside>
      );
    }

    function MobileNav() {
      const loc = useLocation();
      const nav = [
        { path: "/", icon: Home },
        { path: "/preferences", icon: User },
        { path: "/favorites", icon: Heart },
      ];

      return (
        <div className="md:hidden fixed bottom-0 left-0 right-0 bg-black/70 backdrop-blur flex justify-around py-3 z-50">
          {nav.map(i => (
            <Link key={i.path} to={i.path}>
              <i.icon
                className={`w-6 h-6 ${
                  loc.pathname === i.path ? "text-white" : "text-white/50"
                }`}
              />
            </Link>
          ))}
        </div>
      );
    }

    const Page = ({ children }) => (
      <motion.div
        initial={{ opacity: 0, y: 20 }}
        animate={{ opacity: 1, y: 0 }}
        exit={{ opacity: 0, y: -10 }}
        transition={{ duration: 0.3 }}
        className="pt-28"
      >
        {children}
      </motion.div>
    );

    function Discover() {
      return (
        <Page>
          <h1 className="text-3xl font-bold mb-4">Discover Luxury</h1>
          <p className="text-white/70">
            Curated fashion based on your vibe.
          </p>
        </Page>
      );
    }

    function Preferences() {
      return (
        <Page>
          <h1 className="text-3xl font-bold mb-4">Your Preferences</h1>
          <p className="text-white/70">
            Choose styles, colors, and fits.
          </p>
        </Page>
      );
    }

    function Favorites() {
      return (
        <Page>
          <h1 className="text-3xl font-bold mb-4">Saved Favorites</h1>
          <p className="text-white/70">
            Your liked pieces live here.
          </p>
        </Page>
      );
    }

    function App() {
      const location = useLocation();

      return (
        <>
          <Navbar />
          <Sidebar />
          <MobileNav />

          <main className="md:ml-64 px-6 pb-24">
            <AnimatePresence mode="wait">
              <Routes location={location} key={location.pathname}>
                <Route path="/" element={<Discover />} />
                <Route path="/preferences" element={<Preferences />} />
                <Route path="/favorites" element={<Favorites />} />
              </Routes>
            </AnimatePresence>
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <HashRouter>
        <App />
      </HashRouter>
    );
  </script>
</body>
</html>
